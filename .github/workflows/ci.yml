name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-security:
    name: Code Quality & Security Auditing
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'

    - name: Install Linting & Security Tools
      run: |
        python -m pip install --upgrade pip
        pip install ruff bandit

    - name: Ruff Linter Check
      run: |
        ruff check backend/ tests/ --exit-non-zero-on-fix || true

    - name: Bandit Cryptographic & Security Scan
      run: |
        bandit -r backend/ -ll -x tests,data

  test:
    name: Automated Matrix Testing (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Environment Variables
      run: |
        cp .env.example .env

    - name: Execute Full Pytest Test Suite
      run: |
        pytest tests/ -v --tb=short

    - name: Verify Docker Container Build
      run: |
        docker build -t gge-enterprise-app:ci-test .
