# ==============================================================================
# GOLDEN GLOBAL EXPO — PRODUCTION MULTI-CONTAINER ORCHESTRATION
# Enterprise Stack: FastAPI ASGI + PostgreSQL 16 + Nginx SSL Reverse Proxy
# ==============================================================================

version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: gge_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gge_production}
      POSTGRES_USER: ${POSTGRES_USER:-gge_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gge_prod_secure_vault_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gge_admin} -d ${POSTGRES_DB:-gge_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gge_prod_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gge_backend_prod
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql://${POSTGRES_USER:-gge_admin}:${POSTGRES_PASSWORD:-gge_prod_secure_vault_2026}@db:5432/${POSTGRES_DB:-gge_production}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - PORT=8000
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - LOGISTICS_PASSWORD=${LOGISTICS_PASSWORD:-}
      - MASTER_SECURITY_KEY=${MASTER_SECURITY_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET:-}
    volumes:
      - uploads_data:/app/uploads
      - data_backup:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - gge_prod_net

  nginx:
    image: nginx:alpine
    container_name: gge_nginx_prod
    restart: always
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./images:/usr/share/nginx/html/images:ro
      - uploads_data:/usr/share/nginx/html/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gge_prod_net

networks:
  gge_prod_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local
  data_backup:
    driver: local
