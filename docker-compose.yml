# ==============================================================================
# GOLDEN GLOBAL EXPO — ENTERPRISE DOCKER COMPOSE ORCHESTRATION
# ==============================================================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gge_enterprise_app
    restart: always
    env_file:
      - .env
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./data/enterprise.db
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/prices"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - gge_internal_net

  nginx:
    image: nginx:alpine
    container_name: gge_enterprise_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./images:/usr/share/nginx/html/images:ro
    depends_on:
      - app
    networks:
      - gge_internal_net

networks:
  gge_internal_net:
    driver: bridge
