
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Luxury Brand Intro Prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0B0907; }

    .lux-intro {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #0B0907;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 48px;
      z-index: 999999;
      user-select: none;
      overflow: hidden;
    }

    /* Ambient Radiance */
    .lux-intro__radiance {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 172, 82, 0.14) 0%, rgba(184, 135, 47, 0.05) 45%, transparent 70%);
      filter: blur(40px);
      pointer-events: none;
      animation: luxPulse 4s ease-in-out infinite alternate;
    }

    /* Subtle Animated Golden Halo Ring */
    .lux-intro__halo {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      border: 1px solid rgba(217, 172, 82, 0.25);
      box-shadow: 0 0 30px rgba(217, 172, 82, 0.12), inset 0 0 30px rgba(217, 172, 82, 0.08);
      pointer-events: none;
      opacity: 0;
      animation: haloExpand 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    /* Canvas Particles */
    #luxParticleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Top Bar */
    .lux-intro__topbar {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .lux-intro__brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.74rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: rgba(245, 239, 224, 0.7);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .lux-intro__brand::before {
      content: '◆';
      color: #D9AC52;
      font-size: 0.65rem;
    }
    .lux-intro__actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lux-intro__btn {
      appearance: none;
      border: 1px solid rgba(217, 172, 82, 0.30);
      background: rgba(20, 17, 14, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #F5EFE0;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .lux-intro__btn:hover {
      border-color: #D9AC52;
      background: rgba(217, 172, 82, 0.15);
      color: #FFF;
      transform: translateY(-1px);
    }

    /* Center Stage */
    .lux-intro__stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      z-index: 5;
    }

    /* Emblem Wrap with Specular Shimmer */
    .lux-intro__emblem-wrap {
      position: relative;
      width: 220px;
      height: 290px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.92);
      animation: emblemEmerge 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.4s;
    }
    .lux-intro__emblem-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.65)) drop-shadow(0 0 35px rgba(217, 172, 82, 0.25));
    }

    /* Specular Light Ray Sweep across Emblem */
    .lux-intro__shimmer {
      position: absolute;
      inset: -20px;
      background: linear-gradient(115deg, transparent 20%, rgba(255, 245, 215, 0.75) 48%, rgba(255, 255, 255, 0.95) 50%, rgba(217, 172, 82, 0.8) 53%, transparent 75%);
      mix-blend-mode: overlay;
      pointer-events: none;
      transform: translateX(-150%) rotate(5deg);
      animation: shimmerSweep 1.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 1.2s;
    }

    /* Typography Reveal */
    .lux-intro__title {
      font-family: 'Fraunces', serif;
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #F5EFE0;
      text-align: center;
      margin-top: 28px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8), 0 0 24px rgba(217, 172, 82, 0.3);
      opacity: 0;
      transform: translateY(10px);
      animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.4s;
    }
    .lux-intro__kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #D9AC52;
      text-align: center;
      margin-top: 8px;
      opacity: 0;
      transform: translateY(8px);
      animation: textReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.6s;
    }

    /* Bottom Signature */
    .lux-intro__bottombar {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .lux-intro__subline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.64rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(245, 239, 224, 0.55);
      font-weight: 500;
    }
    .lux-intro__timeline {
      width: 150px;
      height: 2px;
      background: rgba(217, 172, 82, 0.18);
      border-radius: 2px;
      overflow: hidden;
    }
    .lux-intro__timeline-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #B8872F 0%, #E8C170 50%, #B8872F 100%);
      animation: timelineFill 3.4s linear forwards 0.4s;
    }

    /* Keyframes */
    @keyframes luxPulse {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; }
    }
    @keyframes haloExpand {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      50% { opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(1.0); opacity: 0.65; }
    }
    @keyframes emblemEmerge {
      0% { opacity: 0; transform: scale(0.88) translateY(12px); filter: blur(6px); }
      100% { opacity: 1; transform: scale(1.0) translateY(0); filter: blur(0); }
    }
    @keyframes shimmerSweep {
      0% { transform: translateX(-150%) rotate(5deg); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translateX(180%) rotate(5deg); opacity: 0; }
    }
    @keyframes textReveal {
      0% { opacity: 0; transform: translateY(10px); letter-spacing: 0.14em; }
      100% { opacity: 1; transform: translateY(0); letter-spacing: 0.24em; }
    }
    @keyframes timelineFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @media (max-width: 767.98px) {
      .lux-intro {
        padding: 24px 20px 32px;
      }
      .lux-intro__radiance {
        width: 380px;
        height: 380px;
      }
      .lux-intro__halo {
        width: 280px;
        height: 280px;
      }
      .lux-intro__emblem-wrap {
        width: 160px;
        height: 215px;
      }
      .lux-intro__title {
        font-size: 1.25rem;
        letter-spacing: 0.18em;
        margin-top: 20px;
      }
      .lux-intro__kicker {
        font-size: 0.58rem;
        letter-spacing: 0.20em;
      }
      .lux-intro__brand {
        font-size: 0.60rem;
        letter-spacing: 0.16em;
      }
      .lux-intro__btn {
        padding: 6px 12px;
        font-size: 0.58rem;
      }
      .lux-intro__subline {
        font-size: 0.56rem;
      }
    }
  </style>
</head>
<body>
  <div class="lux-intro">
    <div class="lux-intro__radiance"></div>
    <div class="lux-intro__halo"></div>
    <canvas id="luxParticleCanvas"></canvas>

    <!-- Top Bar -->
    <div class="lux-intro__topbar">
      <div class="lux-intro__brand">Golden Global Expo</div>
      <div class="lux-intro__actions">
        <button class="lux-intro__btn" id="audioBtn">
          <span>🔇 Sound</span>
        </button>
        <button class="lux-intro__btn">
          <span>Skip ✕</span>
        </button>
      </div>
    </div>

    <!-- Center Stage -->
    <div class="lux-intro__stage">
      <div class="lux-intro__emblem-wrap">
        <img class="lux-intro__emblem-img" src="images/sf_logo_luxury_transparent.png" alt="Six Lady Farmers Monogram">
        <div class="lux-intro__shimmer"></div>
      </div>
      <div class="lux-intro__title">Golden Global Expo</div>
      <div class="lux-intro__kicker">A Six Lady Farmers Initiative</div>
    </div>

    <!-- Bottom Bar -->
    <div class="lux-intro__bottombar">
      <div class="lux-intro__subline">JNPT Nhava Sheva · Mumbai</div>
      <div class="lux-intro__timeline">
        <div class="lux-intro__timeline-fill"></div>
      </div>
    </div>
  </div>

  <script>
    // Particle Engine (Golden Stardust)
    const canvas = document.getElementById('luxParticleCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    const count = 35;
    for(let i=0; i<count; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.5,
        alpha: Math.random() * 0.5 + 0.2,
        dx: (Math.random() - 0.5) * 0.3,
        dy: -Math.random() * 0.4 - 0.1
      });
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      for(let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(217, 172, 82, ' + p.alpha + ')';
        ctx.shadowColor = 'rgba(217, 172, 82, 0.6)';
        ctx.shadowBlur = 6;
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if(p.y < 0) { p.y = height + 10; p.x = Math.random() * width; }
        if(p.x < 0) p.x = width;
        if(p.x > width) p.x = 0;
      }
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
