
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0A0806; }

    .lux-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 45%, #18130E 0%, #0C0A07 65%, #050403 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 36px 48px;
      z-index: 999999;
      user-select: none;
      overflow: hidden;
    }

    #luxCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* Ambient Warm Glow */
    .lux-aura {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(217, 172, 82, 0.18) 0%, rgba(184, 135, 47, 0.06) 50%, transparent 70%);
      filter: blur(50px);
      pointer-events: none;
    }

    /* Top Bar */
    .lux-topbar {
      position: relative;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .lux-brand {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.74rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(245, 239, 224, 0.8);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .lux-brand::before {
      content: '◆';
      color: #D9AC52;
      font-size: 0.65rem;
    }
    .lux-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .lux-btn {
      appearance: none;
      border: 1px solid rgba(217, 172, 82, 0.35);
      background: rgba(24, 19, 14, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #F5EFE0;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    /* Center Medallion Stage */
    .lux-center {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: auto 0;
      z-index: 5;
    }

    /* Sovereign Seal Medallion */
    .lux-seal {
      width: 250px;
      height: 250px;
      border-radius: 50%;
      position: relative;
      background: radial-gradient(circle at 48% 46%, #FAF7F2 0%, #EFEAE0 60%, #DDD5C5 100%);
      border: 1.5px solid rgba(217, 172, 82, 0.65);
      box-shadow: 
        0 24px 60px rgba(0, 0, 0, 0.65),
        0 0 0 8px rgba(24, 19, 14, 0.8),
        0 0 0 9.5px rgba(217, 172, 82, 0.35),
        0 0 45px rgba(217, 172, 82, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      animation: sealScale 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .lux-seal-img {
      width: 78%;
      height: 78%;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(45, 62, 43, 0.15));
      animation: emblemReveal 1.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Light Sweep across the Seal */
    .lux-seal-shine {
      position: absolute;
      inset: -50%;
      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.55) 48%, rgba(255, 245, 220, 0.9) 50%, rgba(217, 172, 82, 0.7) 52%, transparent 65%);
      mix-blend-mode: overlay;
      pointer-events: none;
      transform: translateX(-120%) rotate(25deg);
      animation: shineSlide 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.6s;
    }

    /* Typography */
    .lux-title {
      font-family: 'Fraunces', serif;
      font-size: 1.75rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #F5EFE0;
      text-align: center;
      margin-top: 30px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.9), 0 0 30px rgba(217, 172, 82, 0.35);
      animation: textRise 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.8s;
    }

    .lux-kicker {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.70rem;
      font-weight: 600;
      letter-spacing: 0.30em;
      text-transform: uppercase;
      color: #D9AC52;
      text-align: center;
      margin-top: 8px;
      animation: textRise 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards 1.0s;
    }

    /* Bottom Signature */
    .lux-bottombar {
      position: relative;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .lux-subline {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: rgba(245, 239, 224, 0.6);
      font-weight: 500;
    }
    .lux-timeline {
      width: 160px;
      height: 2px;
      background: rgba(217, 172, 82, 0.20);
      border-radius: 2px;
      overflow: hidden;
    }
    .lux-timeline-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #B8872F 0%, #F5DE98 50%, #B8872F 100%);
      animation: progressFill 3.4s linear forwards 0.4s;
    }

    @keyframes sealScale {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1.0); opacity: 1; }
    }
    @keyframes emblemReveal {
      0% { transform: scale(0.92); opacity: 0; filter: blur(4px); }
      100% { transform: scale(1.0); opacity: 1; filter: blur(0); }
    }
    @keyframes shineSlide {
      0% { transform: translateX(-120%) rotate(25deg); }
      100% { transform: translateX(130%) rotate(25deg); }
    }
    @keyframes textRise {
      0% { opacity: 0; transform: translateY(12px); letter-spacing: 0.16em; }
      100% { opacity: 1; transform: translateY(0); letter-spacing: 0.26em; }
    }
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }

    @media (max-width: 767.98px) {
      .lux-stage { padding: 24px 20px 32px; }
      .lux-seal { width: 210px; height: 210px; }
      .lux-title { font-size: 1.25rem; letter-spacing: 0.18em; margin-top: 22px; }
      .lux-kicker { font-size: 0.58rem; letter-spacing: 0.22em; }
      .lux-brand { font-size: 0.62rem; letter-spacing: 0.18em; }
      .lux-btn { padding: 6px 12px; font-size: 0.58rem; }
      .lux-subline { font-size: 0.56rem; }
    }
  </style>
</head>
<body>
  <div class="lux-stage">
    <div class="lux-aura"></div>
    <canvas id="luxCanvas"></canvas>

    <!-- Top Bar -->
    <div class="lux-topbar">
      <div class="lux-brand">Golden Global Expo</div>
      <div class="lux-actions">
        <button class="lux-btn"><span>🔇 Sound</span></button>
        <button class="lux-btn"><span>Skip ✕</span></button>
      </div>
    </div>

    <!-- Center Stage -->
    <div class="lux-center">
      <div class="lux-seal">
        <img class="lux-seal-img" src="images/sf_logo_luxury_transparent.png" alt="Six Lady Farmers">
        <div class="lux-seal-shine"></div>
      </div>
      <div class="lux-title">Golden Global Expo</div>
      <div class="lux-kicker">A Six Lady Farmers Initiative</div>
    </div>

    <!-- Bottom Bar -->
    <div class="lux-bottombar">
      <div class="lux-subline">JNPT Nhava Sheva · Mumbai</div>
      <div class="lux-timeline">
        <div class="lux-timeline-fill"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('luxCanvas');
    const ctx = canvas.getContext('2d');
    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    const particles = [];
    for(let i=0; i<40; i++) {
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        r: Math.random() * 1.5 + 0.6,
        alpha: Math.random() * 0.5 + 0.25,
        dx: (Math.random() - 0.5) * 0.25,
        dy: -Math.random() * 0.35 - 0.1
      });
    }

    function render() {
      ctx.clearRect(0, 0, width, height);
      for(let p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(217, 172, 82, ' + p.alpha + ')';
        ctx.shadowColor = 'rgba(217, 172, 82, 0.7)';
        ctx.shadowBlur = 8;
        ctx.fill();
        p.x += p.dx;
        p.y += p.dy;
        if(p.y < 0) { p.y = height + 10; p.x = Math.random() * width; }
        if(p.x < 0) p.x = width;
        if(p.x > width) p.x = 0;
      }
      requestAnimationFrame(render);
    }
    render();
  </script>
</body>
</html>
